services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  app:
    build:
      context: .
      target: application
      args:
        COMPOSER_LOCK_SHA: ${COMPOSER_LOCK_SHA:-development}
    image: asistencias:local
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      RUN_MIGRATIONS: "true"
    volumes:
      - app_storage:/var/www/html/storage
      - public_assets:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit((extension_loaded(\"pdo_pgsql\") && file_exists(\"public/index.php\")) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  worker:
    image: asistencias:local
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      RUN_AS_WWW_DATA: "true"
    volumes:
      - app_storage:/var/www/html/storage
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120"]
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

  scheduler:
    image: asistencias:local
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-.env.docker}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      RUN_AS_WWW_DATA: "true"
    volumes:
      - app_storage:/var/www/html/storage
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8082}:80"
    volumes:
      - public_assets:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:
    name: asistencias_postgres_data
  app_storage:
    name: asistencias_app_storage
  public_assets:
    name: asistencias_public_assets

networks:
  backend:
    driver: bridge
